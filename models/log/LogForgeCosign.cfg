\* do: a removed key undoes no revocation.
CONSTANTS
  Keys = {k1, k2, k3}
  PairedKeys = {}
  PairNeeded = 1
  Nodes = {n1, n2}
  Validators = {v1, v2}
  Compromised = {k2, k3}
  GenesisAdmins = {k1, k2, k3}
  GenesisQuorum = 1
  GenesisNodes = {n1}
  MaxRecords = 3
  Kinds = {"RemoveNode", "RemoveAdmin"}
  CompactPolicy = "none"
  CopiesWritten = FALSE
  AuthorTakesIn = FALSE
SPECIFICATION TraceSpec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
  QuorumOnChain
  FloorHolds
  RemovedKeyUndoesNoRevocation
