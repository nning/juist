\* One person with two keys, both of which must sign: every property holds.
CONSTANTS
  Keys = {k1, k2, k3}
  PairedKeys = {k1, k2}
  PairNeeded = 2
  Nodes = {n1, n2}
  Validators = {v1, v2}
  Compromised = {}
  GenesisAdmins = {k1, k2, k3}
  GenesisQuorum = 1
  GenesisNodes = {n1}
  MaxRecords = 3
  Kinds = {"AddNode", "RemoveNode", "RemoveAdmin", "SetQuorum", "EpochBump", "Checkpoint"}
  CompactPolicy = "none"
  CopiesWritten = FALSE
  AuthorTakesIn = FALSE
SPECIFICATION TraceSpec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
  QuorumOnChain
  FloorHolds
  RemovedKeyUndoesNoRevocation
  RaiseHoldsAgainstStrippedKeys
  Agreement
  Convergence
