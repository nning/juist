\* One admin key the attacker's, at a quorum of one: a removed key undoes
\* no revocation. Only the kinds that revoke, as admissions and bumps
\* change nothing of it.
CONSTANTS
  Keys = {k1, k2, k3}
  PairedKeys = {}
  PairNeeded = 1
  Nodes = {n1, n2}
  Validators = {v1, v2}
  Compromised = {k3}
  GenesisAdmins = {k1, k2, k3}
  GenesisQuorum = 1
  GenesisNodes = {n1}
  MaxRecords = 3
  Kinds = {"RemoveNode", "RemoveAdmin", "SetQuorum"}
  CompactPolicy = "none"
  CopiesWritten = FALSE
  AuthorTakesIn = FALSE
SPECIFICATION TraceSpec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
  QuorumOnChain
  FloorHolds
  RemovedKeyUndoesNoRevocation
