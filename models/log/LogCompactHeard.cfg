\* Compaction as juistd does it, once every other device is heard past the
\* newest checkpoint; an author's device takes its record in at once.
CONSTANTS
  Keys = {k1, k2, k3}
  PairedKeys = {}
  PairNeeded = 1
  Nodes = {n1, n2}
  Validators = {v1, v2}
  Compromised = {}
  GenesisAdmins = {k1, k2, k3}
  GenesisQuorum = 2
  GenesisNodes = {n1}
  MaxRecords = 3
  Kinds = {"AddNode", "RemoveNode", "RemoveAdmin", "SetQuorum", "EpochBump", "Checkpoint"}
  CompactPolicy = "heard"
  CopiesWritten = FALSE
  AuthorTakesIn = TRUE
SPECIFICATION TraceSpec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
  Agreement
