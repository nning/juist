\* Traces for trust/log's replay: one admin key the attacker's, at a quorum of one.
CONSTANTS
  Keys = {k1, k2, k3}
  PairedKeys = {}
  PairNeeded = 1
  Nodes = {n1, n2}
  Validators = {v1, v2}
  Compromised = {k3}
  GenesisAdmins = {k1, k2, k3}
  GenesisQuorum = 1
  GenesisNodes = {n1}
  MaxRecords = 4
  Kinds = {"AddNode", "RemoveNode", "RemoveAdmin", "SetQuorum", "EpochBump", "Checkpoint"}
  CompactPolicy = "none"
  CopiesWritten = FALSE
  AuthorTakesIn = FALSE
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
