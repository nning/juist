\* The person with two keys, both needed for its vote, is the attacker's: a
\* removed key undoes no revocation, signing beside the other included.
CONSTANTS
  Keys = {k1, k2, k3}
  PairedKeys = {k1, k2}
  PairNeeded = 2
  Nodes = {n1, n2}
  Validators = {v1, v2}
  Compromised = {k1, k2}
  GenesisAdmins = {k1, k2, k3}
  GenesisQuorum = 1
  GenesisNodes = {n1}
  MaxRecords = 3
  Kinds = {"RemoveNode", "RemoveAdmin", "SetQuorum"}
  CompactPolicy = "none"
  CopiesWritten = FALSE
  AuthorTakesIn = FALSE
SPECIFICATION TraceSpec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
  QuorumOnChain
  FloorHolds
  RemovedKeyUndoesNoRevocation
