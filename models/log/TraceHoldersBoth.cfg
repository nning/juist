\* Traces for trust/log's replay: one person with two keys, both needed
\* for its vote, at a quorum of one, and copies.
CONSTANTS
  Keys = {k1, k2, k3}
  PairedKeys = {k1, k2}
  PairNeeded = 2
  Nodes = {n1, n2}
  Validators = {v1, v2}
  Compromised = {}
  GenesisAdmins = {k1, k2, k3}
  GenesisQuorum = 1
  GenesisNodes = {n1}
  MaxRecords = 4
  Kinds = {"AddNode", "RemoveNode", "RemoveAdmin", "SetQuorum", "EpochBump", "Checkpoint"}
  CompactPolicy = "none"
  CopiesWritten = TRUE
  AuthorTakesIn = FALSE
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
