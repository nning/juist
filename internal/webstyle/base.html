<style>
@font-face { font-family: Plex; font-weight: 400; font-display: swap; src: url({{.Assets}}plex-sans-400.woff2) format("woff2"); unicode-range: U+0000, U+000D, U+0020-007E, U+00A0-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A, U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+20AC, U+2122, U+2212, U+FB01-FB02; }
@font-face { font-family: Plex; font-weight: 600; font-display: swap; src: url({{.Assets}}plex-sans-600.woff2) format("woff2"); unicode-range: U+0000, U+000D, U+0020-007E, U+00A0-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A, U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+20AC, U+2122, U+2212, U+FB01-FB02; }
@font-face { font-family: PlexMono; font-weight: 400; font-display: swap; src: url({{.Assets}}plex-mono-400.woff2) format("woff2"); unicode-range: U+0000, U+000D, U+0020-007E, U+00A0-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A, U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+20AC, U+2122, U+2212, U+FB01-FB02; }
:root {
	--sans: Plex, system-ui, sans-serif; --mono: PlexMono, ui-monospace, monospace;
	color-scheme: light dark;
	--bg: #0a1317; --panel: #102127; --panel-2: #142a31; --line: #1d363e; --line-2: #7d9192;
	--text: #e4dccb; --text-2: #a9b8b4; --muted: #7d9192;
	--accent: #46d1bf; --accent-ink: #062823; --sand: #e8c98e; --red: #f0644f;
	--direct: #4cc68a; --relay: #f1c453; --sought: #46d1bf; --absent: #7d9192; --alarm: #f0644f;
}
@media (prefers-color-scheme: light) {
	:root {
		--bg: #f6f0e1; --panel: #fbf7ec; --panel-2: #efe7d3; --line: #ddd3bb; --line-2: #5f6e6d;
		--text: #17262b; --text-2: #3d5157; --muted: #5f6e6d;
		--accent: #0b7268; --accent-ink: #f6f0e1; --sand: #8a5d0f; --red: #b82d1b;
		--direct: #1a7444; --relay: #8f6100; --sought: #0b7268; --absent: #5f6e6d; --alarm: #b82d1b;
	}
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent); color: var(--accent-ink); }
.bar { height: 56px; border-bottom: 1px solid var(--line); }
.bar .in, main, footer .in { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
.bar .in { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { color: var(--text); --mark-link: var(--accent); line-height: 0; }
.brand svg { height: 24px; width: auto; }
.bar .note { font: 400 13px var(--mono); color: var(--muted); }
main { padding-top: 36px; padding-bottom: 72px; }
.crumbs { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.crumbs a { color: var(--muted); }
.crumbs span { margin: 0 6px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
h1 { font-size: clamp(28px, 3.6vw, 40px); font-weight: 600; line-height: 1.2; letter-spacing: -0.025em; margin: 8px 0 10px; overflow-wrap: anywhere; }
.meta { font: 400 13px var(--mono); color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 8px; }
th { text-align: left; font-weight: 600; font-size: 13.5px; border-bottom: 1px solid var(--line-2); padding: 10px 16px 8px 0; white-space: nowrap; }
th a { color: var(--text); text-decoration: none; }
th a:hover { color: var(--accent); }
td { border-bottom: 1px solid var(--line); padding: 9px 16px 9px 0; vertical-align: middle; }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }
footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 13.5px; }
@media (max-width: 640px) {
	.bar .in, main, footer .in { padding: 0 16px; }
	main { padding-top: 24px; padding-bottom: 48px; }
	td, th { padding-right: 10px; }
}
</style>{{end}}
