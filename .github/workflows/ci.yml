name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs write access to the repository.
permissions:
  contents: read

# A new push to a PR makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Latest patch release of the 1.26 line; go.mod pins the minimum the module
  # needs. Bump this when the go directive moves to a newer minor.
  GO_VERSION: '1.26'

jobs:
  test:
    name: test (race + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      # Milestone exit criteria are cumulative: every criterion from M0 onward
      # stays enforced here as an ordinary test. See docs/05-roadmap.md.
      # JUIST_REQUIRE_HOST_NET makes internal/nettest's gates fail rather than
      # skip: the host features they probe are givens on this runner.
      - run: make cover
        env:
          JUIST_REQUIRE_HOST_NET: '1'

  os-plumbing:
    name: OS plumbing (privileged)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      # The M3a real-device tests need root, /dev/net/tun and iproute2, so the
      # test job above skips them. This is the one place they actually run:
      # the single-device wiring test and the netns harness that carries ICMP
      # and TCP between two nodes with real devices. It is its own job so the
      # privileged surface stays this one command, and so a failure here is
      # attributable to the OS plumbing and nothing else.
      # `sudo -E` keeps setup-go's GOROOT and GOPATH; PATH is passed explicitly
      # because sudo resets it, and HOME is kept so the caches sudo would
      # otherwise point at /root are the ones setup-go populated.
      # iptables is what the M3b NAT lab translates with. The runner image
      # ships it; installing it here rather than skipping keeps a missing tool
      # from quietly reducing the matrix to nothing.
      - run: sudo apt-get install -y --no-install-recommends iptables
      - run: sudo -E env "PATH=$PATH" "HOME=$HOME" make test-os-plumbing

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - run: make fmt-check
      - run: make vet
      - run: make staticcheck
      - run: make actionlint

  tidy:
    name: go.mod tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - run: make tidy-check

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      # The v1 platform set (docs/05-roadmap.md M5). Compiling for each keeps
      # the embedded Tailscale stack's build tags honest between milestones.
      - run: make cross

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - run: make govulncheck

  tcb:
    name: TCB size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      # The audit scope's size is a tracked regression metric
      # (docs/06-verification.md); this fails if it grows past the budget.
      - run: make tcb
